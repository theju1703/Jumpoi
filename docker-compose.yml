version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: jompoi_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jompoi_db
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: jompoi_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

  pipeline-app:
    build: .
    container_name: jompoi_analytics_hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=jompoi_db
      - BQ_PROJECT_ID=jompoi-grocery-analytics
      - BQ_DATASET_ID=jompoi_reporting
    depends_on:
      - mongodb

volumes:
  mongo_data:
